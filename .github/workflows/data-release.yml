name: Data release

on:
  push:
    branches: [main]
    paths:
      - "notebooks/datacorp*"
      - "skills/**"
      - "scripts/build_duckdb.py"
      - ".github/workflows/data-release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build DuckDB database
        run: uv run scripts/build_duckdb.py build/datacorp.duckdb

      - name: Assemble zip (no ground truth)
        run: |
          mkdir -p build/datacorp-data
          cp notebooks/datacorp.csv \
             notebooks/datacorp_reviews.csv \
             notebooks/datacorp_exit_interviews.csv \
             notebooks/datacorp_salary_history.csv \
             notebooks/datacorp_org_chart.csv \
             notebooks/datacorp_tickets.csv \
             notebooks/datacorp_payroll_q3.xlsx \
             build/datacorp.duckdb \
             build/datacorp-data/
          cp -r skills build/datacorp-data/skills
          cd build && zip -r datacorp-data.zip datacorp-data

      - name: Guard against ground-truth leakage
        run: |
          if unzip -l build/datacorp-data.zip | grep -i ground_truth; then
            echo "Ground-truth file found in zip — refusing to publish."
            exit 1
          fi

      - name: Update rolling release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete datacorp-data --yes || true
          git push origin :refs/tags/datacorp-data || true
          gh release create datacorp-data build/datacorp-data.zip \
            --title "DataCorp data (rolling)" \
            --notes "Aktuální data kurzu: 6 CSV tabulek, mzdový list (xlsx), datacorp.duckdb a složka skills/. Bez ground-truth souborů. Automaticky přegenerováno při každé změně dat na main." \
            --latest=false

      - name: Create versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/datacorp-data.zip \
            --title "DataCorp data ${GITHUB_REF_NAME}" \
            --notes "Verzovaná data kurzu (${GITHUB_REF_NAME}): 6 CSV tabulek, mzdový list (xlsx), datacorp.duckdb a složka skills/. Bez ground-truth souborů."
